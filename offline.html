<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нет соединения</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e8eff5 0%, #d4e1f0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .offline-container {
      text-align: center;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .offline-icon {
      font-size: 5rem;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #2c3e50;
    }
    p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .retry-btn {
      background: linear-gradient(135deg, #0074D9, #005a8e);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,116,217,0.4);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>Нет соединения</h1>
    <p>Проверьте подключение к интернету и попробуйте снова.</p>
    <button class="retry-btn" onclick="location.reload()">⟳ Повторить</button>
  </div>
</body>
</html>
